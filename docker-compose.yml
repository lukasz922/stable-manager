services:
  db:
    image: postgres:16
    container_name: stable_manager_db
    restart: always
    environment:
      POSTGRES_DB: stable_manager
      POSTGRES_USER: stable_user
      POSTGRES_PASSWORD: stable_password
      TZ: Europe/Warsaw
    ports:
      - "5432:5432"
    volumes:
      - stable_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stable_user -d stable_manager"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: stable_manager_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://stable_user:stable_password@db:5432/stable_manager
      SECRET_KEY: change_me_super_secret
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      TZ: Europe/Warsaw
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  db-backup:
    image: postgres:16
    container_name: stable_manager_db_backup
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: stable_manager
      PGUSER: stable_user
      PGPASSWORD: stable_password
      TZ: Europe/Warsaw
      BACKUP_RETENTION_DAYS: 14
    volumes:
      - ./backups:/backups
    command:
      - /bin/bash
      - -c
      - |
        set -e

        make_backup() {
          filename="/backups/stable_manager_$$(date +%Y-%m-%d_%H-%M-%S).dump"
          echo "[$$(date)] Tworzenie kopii: $$filename"

          pg_dump             --format=custom             --compress=9             --no-owner             --no-privileges             --file="$$filename"

          echo "[$$(date)] Kopia utworzona: $$filename"

          find /backups             -type f             -name "stable_manager_*.dump"             -mtime +"$${BACKUP_RETENTION_DAYS}"             -delete

          echo "[$$(date)] Usunięto kopie starsze niż $${BACKUP_RETENTION_DAYS} dni."
        }

        until pg_isready -h "$${PGHOST}" -p "$${PGPORT}" -U "$${PGUSER}" -d "$${PGDATABASE}"; do
          echo "Oczekiwanie na PostgreSQL..."
          sleep 5
        done

        make_backup

        while true; do
          sleep 86400
          make_backup
        done

volumes:
  stable_pgdata: